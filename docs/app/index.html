/* ---- déroulement de l'appel : boucle « écoute → réponse en continu → écoute » ---- */
function callSave(K){DB.calls=DB.calls||[];const i=DB.calls.findIndex(x=>x.id===K.id);const rec={id:K.id,scId:K.scId,sid:K.sid||'',eid:K.eid||'',who:K.who||'',level:K.level,engine:K.engine||'',date:K.date,msgs:K.msgs,debrief:K.debrief||null};
  if(i>=0)DB.calls[i]=rec;else DB.calls.push(rec);save()}
const callScroll=()=>{const n=$('#calllog');if(n)n.scrollTop=n.scrollHeight};
function setPhase(K,ph){K.phase=ph;if(S.call===K&&S.view==='call')render();callScroll()}
/* un tour : la réponse arrive en continu, chaque phrase est dite dès qu'elle est complète */
async function callTurn(text,hidden){const K=S.call;const c=scById(K.scId);text=String(text||'').trim();if(!text||K.busy)return;
  K.msgs.push({r:'u',t:text,hidden:!!hidden});K.draft='';K.live='';K.busy=true;K.err='';K.cut=false;setPhase(K,'thinking');
  const msg={r:'a',t:''};let said=0;
  const flush=all=>{const rest=msg.t.slice(said);const m=all?(rest.trim()?[rest]:null):rest.match(/^[\s\S]*?[.!?…](?=\s)/);if(m){said+=m[0].length;if(K.phase!=='speaking'){K.phase='speaking';const n=$('#call-st');if(n)n.textContent='Le régulateur parle…'}say(m[0].trim())}};
  try{const stream=aiClient().beta.messages.stream({model:AI_CALL_MODEL,max_tokens:2000,thinking:{type:'between_tools'},output_config:{effort:'low'},
      betas:['server-side-fallback-2026-07-01'],fallbacks:'default',system:[{type:'text',text:callSystem(c,K.level),cache_control:{type:'ephemeral'}}],
      messages:K.msgs.map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}))});
    K.stream=stream;
    for await(const ev of stream){if(S.call!==K||K.cut)break;
      if(ev.type==='content_block_delta'&&ev.delta.type==='text_delta'){if(!msg.t){K.msgs.push(msg);if(K.mode==='text')render()}msg.t+=ev.delta.text;
        const b=$('#calllog .bub:last-child');if(b)b.lastChild.textContent=msg.t;callScroll();let before;do{before=said;flush(false)}while(said!==before)}}
    if(!K.cut){const fin=await stream.finalMessage();if(fin.stop_reason==='refusal')throw new Error('Le régulateur simulé n’a pas pu répondre');
      const full=fin.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();if(full&&full!==msg.t.trim()){if(!msg.t)K.msgs.push(msg);msg.t=full}flush(true)}
    K.stream=null;K.busy=false;callSave(K);if(S.call!==K)return;
    if(!msg.t)msg.t='…';if(K.phase!=='speaking')setPhase(K,'speaking');else render();
    await speech();}
  catch(e){K.stream=null;K.busy=false;if(S.call!==K)return;if(K.cut){callSave(K);return}
    if(!msg.t){K.msgs.pop();K.draft=text}K.err=aiErr(e);setPhase(K,K.mode==='voice'?'muted':'text');if(K.mode==='voice')K.muted=true;render()}}
/* boucle vocale : écoute, envoie seul après un silence, parle, réécoute */
async function callLoop(K){if(K.looping)return;K.looping=true;
  try{while(S.call===K&&K.started&&!K.debrief&&!K.ending&&K.mode==='voice'&&!K.muted){
    await speech();if(S.call!==K||K.muted||K.ending||K.mode!=='voice')break;
    setPhase(K,'listening');K.live='';
    if(K.rec)K.rec.loud=0;const t0=Date.now();let t='';try{t=await listenTurn(()=>{if(K.phase!=='talking'){K.phase='talking';const n=$('#call-st'),r=$('.ring');if(n)n.textContent='Vous parlez…';if(r)r.className='ring talking'}})}catch(e){K.err=String(e.message||e);K.muted=true;setPhase(K,'muted');break}
    if(S.call!==K||K.muted||K.ending||K.mode!=='voice')break;
    if(t)K.heardOnce=true;
    if(!t&&K.rec&&K.rec.on&&!K.heardOnce&&K.rec.loud>1500){K.recConflict=(K.recConflict||0)+1;if(K.recConflict>=2){await recStop(K);K.rec=null;toast('Ce téléphone ne peut pas écouter et enregistrer en même temps : l’enregistrement est arrêté, l’appel continue.')}}
    if(!t){K.silent=(K.silent||0)+1;if(Date.now()-t0<800)await new Promise(r=>setTimeout(r,600));
      if(K.silent===3){setPhase(K,'speaking');say('Allô ? Vous m’entendez ?')}
      if(K.silent>=8){K.muted=true;K.err='Micro coupé après un long silence : touchez « Rouvrir le micro » pour reprendre.';setPhase(K,'muted');break}continue}
    K.silent=0;await callTurn(t)}}
  finally{K.looping=false}}
let callTimer=null;
function startCall(c,opts={}){hush();stopListen();const s=scS();S.call={id:uid(),scId:c.id,sid:s&&s.cursus===c.cur?s.id:'',eid:opts.eid||'',who:opts.who||'',level:opts.level||'standard',date:today(),msgs:[],started:false,t0:0,mode:voiceIn()?'voice':'text',phase:''};go('call')}
function startClock(){clearInterval(callTimer);callTimer=setInterval(()=>{const n=$('#call-clock');if(n&&S.call&&S.call.started){const sec=Math.floor((Date.now()-S.call.t0)/1000);n.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} · ${CALL_LEVELS[S.call.level]}`}},1000)}
function endCallMedia(K){if(K){K.ending=true;K.cut=true;if(K.stream){try{K.stream.abort()}catch(e){}}if(K.el){try{K.el.endSession()}catch(e){}K.el=null}recStop(K)}hush();stopListen();clearInterval(callTimer)}
Object.assign(A,{
  'ai-test':async()=>{if(!aiReady()){toast('Renseignez d’abord la clé ou le serveur relais');return}busy(true,'Test de la connexion…');
    try{const r=await aiAsk({system:'Tu réponds en français, en quelques mots.',messages:[{role:'user',content:'Réponds seulement : connexion établie.'}],max_tokens:500});busy(false);toast('IA disponible : '+r.slice(0,60))}
    catch(e){busy(false);toast(aiErr(e))}},
  'call-start':d=>{const c=scById(d.id||S.scid);if(!c)return;if(d.from==='formative'){S.scFrom='formative'}S.scid=c.id;const e=d.from==='formative'?curEval():null;startCall(c,{eid:e?e.id:''})},

      try{await elStart(K)}catch(e){K.err=String(e.message||e);K.phase='ended';recStop(K);render()}return}
    if(K.mode==='voice')await recStart(K);K.started=true;K.t0=Date.now();K.phase=K.mode==='voice'?'speaking':'text';render();say(AI_GREETING);
    startClock();
    if(K.mode==='voice')callLoop(K)},
  'call-send':()=>{const n=$('#call-in');callTurn(n?n.value:'')},
  'call-mute':()=>{const K=S.call;K.muted=!K.muted;K.err='';if(K.engine==='eleven'){if(K.el)K.el.setMicMuted(K.muted);render();return}if(K.muted){stopListen();setPhase(K,'muted')}else{setPhase(K,'listening');callLoop(K)}},
  'call-interrupt':()=>{const K=S.call;K.cut=true;if(K.stream){try{K.stream.abort()}catch(e){}}hush();K.muted=false;if(!K.looping)callLoop(K);else setPhase(K,'listening')},
  'call-kb':()=>{const K=S.call;if(K.mode==='voice'){K.mode='text';stopListen();setPhase(K,'text')}else{K.mode='voice';K.muted=false;setPhase(K,'listening');callLoop(K)}},
  'call-recall':()=>{const K=S.call;if(K.engine==='eleven'){if(K.el){K.msgs.push({r:'u',t:'(L’équipe rappelle pour le bilan de surveillance.)'});K.el.sendUserMessage('[Quelques minutes plus tard, l’équipe rappelle le 15 pour transmettre le bilan de surveillance.] Allô, c’est l’équipe de secouristes, je vous rappelle pour le bilan de surveillance.')}return}stopListen();callTurn('[Quelques minutes plus tard, l’équipe rappelle le 15 pour transmettre le bilan de surveillance.] Allô le 15, c’est l’équipe de secouristes, je vous rappelle pour le bilan de surveillance.').then(()=>{if(K.mode==='voice'&&!K.muted)callLoop(K)})},
  'call-end':async()=>{const K=S.call,c=scById(K.scId);const rs=recStop(K);endCallMedia(K);await rs;callSave(K);
    if(!aiReady()){K.closed=true;render();window.scrollTo(0,0);return}busy(true,'Correction du bilan…');
    try{const txt=await aiAsk({system:debriefSystem(c,K.level),messages:[{role:'user',content:'Transcription de l’appel :\n'+callTranscript(callLines(K))}],effort:'medium',max_tokens:16000,format:DEBRIEF_FORMAT});
      K.debrief=JSON.parse(txt);callSave(K);busy(false);render();window.scrollTo(0,0)}
    catch(e){busy(false);K.closed=true;render();toast('Correction impossible : '+aiErr(e))}},
  'call-redebrief':()=>{const K=S.call;K.closed=false;A['call-end']()},
  'call-again':()=>{const K=S.call;startCall(scById(K.scId),{eid:K.eid,who:K.who,level:K.level})},
  'call-exit':()=>{const K=S.call;endCallMedia(K);S.call=null;if(K&&K.eid&&S.scFrom==='formative'){go('formative',{eid:K.eid})}else go('scenario',{scid:K?K.scId:S.scid})},
  'call-open':d=>{const x=(DB.calls||[]).find(y=>y.id===d.id);if(!x)return;S.call=Object.assign({started:true,t0:0},clone(x));go('call')},
  'pdf-call':()=>{const K=S.call,c=scById(K.scId);runExport('Création du PDF…',()=>({files:[pdfFile(`${c.cur}_appel-15_${String(c.n).padStart(2,'0')}_${slug(K.who||'apprenant')}_${K.date}`,callPages(K,c))],title:'Appel au 15'}))}
});
function callPages(K,c){const D=K.debrief;return [{orient:'p',draw:doc=>{const P=pen(doc);const w=scWriter(doc,P,`${c.cur} · Transmission du bilan au 15`);
  w.p(c.titre,{b:true,s:15,c:[0,43,107],gap:1});w.p(`${c.cur} · scénario n°${c.n} · ${fmtDate(K.date)}${K.who?' · '+K.who:''} · niveau ${CALL_LEVELS[K.level]||''}`,{s:8.5,c:GREY});w.y+=2;
